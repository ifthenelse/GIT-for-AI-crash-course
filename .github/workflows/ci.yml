# CI is the authoritative gate. Pin actions to commit SHAs if your policy requires it.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: bash scripts/verify
      - run: npm run build
        env:
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH || '/' }}
          SITE_URL: ${{ vars.SITE_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - run: npm run audit:seo

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
